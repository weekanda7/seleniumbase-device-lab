name: device-lab

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: devicelab
      POSTGRES_PASSWORD: devicelab
      POSTGRES_DB: devicelab
    ports:
      - "5433:5432" # host 5433 so it doesn't clash with other local Postgres; DB tests connect here
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devicelab -d devicelab"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      args: &version-args # set by `make up` / CI from git; plain `docker compose up` shows dev (unknown)
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_SHA: ${GIT_SHA:-unknown}
    environment:
      DATABASE_URL: postgresql+psycopg://devicelab:devicelab@db:5432/devicelab
      APP_USERNAME: ${APP_USERNAME:-admin}
      APP_PASSWORD: ${APP_PASSWORD:-admin123}
    ports:
      - "8000:8000" # API tests can hit the backend directly
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  web:
    build:
      context: ./frontend
      args: *version-args
    ports:
      - "8080:80" # UI tests open http://localhost:8080
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 3s
      timeout: 3s
      retries: 20
