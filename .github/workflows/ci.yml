name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # manual "Run workflow" button

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ① Static checks: ruff (backend / tests) + ESLint & Prettier (frontend). No app needed.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # same as frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Lint (backend / frontend / tests)
        run: make lint-check

  # ② Black-box tests: same `docker compose up --wait` as local, then pytest against :8080 / :8000 / :5433.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start app (db + backend + web), wait for healthchecks
        run: docker compose up -d --build --wait
      - uses: astral-sh/setup-uv@v6
      - name: Run tests (headless Chrome, parallel)
        working-directory: tests
        # -n auto: one worker per CPU. Safe because every test creates its own uuid-named data
        # and only asserts on it, then deletes it through the API.
        run: >
          uv run pytest --headless -n auto
          -m "not install_case and not future_case"
          --html=report/report.html --self-contained-html
          --junit-xml=report/report.xml
      - name: Dump app logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: tests/report/
      - name: Stop app
        if: always()
        run: docker compose down -v
