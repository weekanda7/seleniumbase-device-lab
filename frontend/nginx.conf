server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API: the browser calls /api/..., nginx forwards to the backend container.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # SPA routing: unknown paths (e.g. /devices/3) serve index.html, React Router takes over.
    location / {
        try_files $uri /index.html;
    }
}
