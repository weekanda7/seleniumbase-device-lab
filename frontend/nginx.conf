server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API: the browser calls /api/..., nginx forwards to the backend container.
    # resolver + variable: look `backend` up at request time (Docker DNS), not at startup,
    # so nginx doesn't exit when it starts before the backend container (CI services have no order).
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    # SPA routing: unknown paths (e.g. /devices/3) serve index.html, React Router takes over.
    location / {
        try_files $uri /index.html;
    }
}
